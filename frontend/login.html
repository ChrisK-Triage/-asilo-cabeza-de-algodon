<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio de sesión · Asilo Cabeza de Algodón</title>
<link rel="icon" type="image/svg+xml" href="img/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/prototipo.css">
<link rel="stylesheet" href="css/extra.css">
<link rel="stylesheet" href="css/marca.css">
</head>
<body>
<header><div class="barra">
  <span class="marca-logo">
    <img src="img/logo-cabeza-de-algodon-oscuro.svg" alt="Asilo Cabeza de Algodón">
  </span>
  <div class="usuario">Sistema de administración</div>
</div></header>

<div class="centro">
  <div class="caja-login">
    <img class="logo-login" src="img/logo-cabeza-de-algodon.svg" alt="Asilo Cabeza de Algodón">
    <h1>Inicio de sesión</h1>
    <p class="subtitulo">Ingrese con su correo institucional</p>

    <div class="aviso" id="aviso"></div>

    <form id="form-login">
      <div class="campo">
        <label for="email">Correo institucional</label>
        <input id="email" name="email" type="email" autocomplete="username"
               placeholder="medico.general@asilo.org" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-principal" id="btn-entrar">Entrar</button>
    </form>
  </div>
</div>

<script src="js/sesion.js"></script>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
</body>
</html>
